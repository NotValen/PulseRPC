[package]
name = "pulserpc"
version = "1.1.0"
edition = "2021"
rust-version = "1.80"
description = "Lightweight automatic Discord Rich Presence for 90+ desktop applications, with a native GUI"
license = "MIT"
repository = "https://github.com/pulserpc/pulserpc"
keywords = ["discord", "rich-presence", "rpc", "detection"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
time = { version = "0.3", features = ["local-offset"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
