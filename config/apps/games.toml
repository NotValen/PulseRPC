# ═══════════════════════════════════════════════════════════════════════
#  Games
#
#  Game rules require the foreground window, so launchers sitting in the
#  background never take over your presence. Fullscreen windows get an extra
#  score bonus automatically (detection.fullscreen_bonus).
# ═══════════════════════════════════════════════════════════════════════

[[app]]
id = "steam"
name = "Steam"
category = "games"
priority = 40
process = ["steam.exe"]
requires_foreground = true
title_contains = ["steam"]
details = ["Browsing Steam", "Looking for a game", "Adding to the backlog"]
state = ["{time_of_day} · {elapsed}", "Sales incoming"]
large_image = "steam"
large_text = "Steam"

