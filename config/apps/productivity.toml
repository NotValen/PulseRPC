[[app]]
id = "notion"
name = "Notion"
category = "productivity"
priority = 58
process = ["Notion.exe"]
strip_suffixes = [" – Notion", " - Notion"]
details = ["Writing in Notion", "Organizing thoughts", "Planning something"]
state = ["{title_short}", "{time_of_day} · {elapsed}"]
large_image = "notion"
large_text = "Notion"

[[app]]
id = "obsidian"
name = "Obsidian"
category = "productivity"
priority = 58
process = ["Obsidian.exe"]
strip_regex = [' - Obsidian.*$']
project_index = 1
details = ["Taking notes", "Linking ideas", "Writing in the vault"]
state = ["{project}", "{filename}", "{time_of_day} · {elapsed}"]
large_image = "obsidian"
large_text = "Obsidian"

