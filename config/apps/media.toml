# ═══════════════════════════════════════════════════════════════════════
#  Music & video players
#
#  `media = true` parses "Artist - Title" from the window title and exposes
#  {artist}, {track} and {media} template variables.
#  `activity_type = 2` shows "Listening to …" instead of "Playing …".
#
#  By default a foreground app (bonus +1000) wins over a background player.
#  Want music to always be shown while it plays? Set its priority above
#  1000, e.g. `priority = 1200` — it will then outrank anything in focus.
# ═══════════════════════════════════════════════════════════════════════

[[app]]
id = "spotify"
name = "Spotify"
category = "media"
priority = 45
process = ["Spotify.exe"]
media = true
activity_type = 2
strip_suffixes = [" | Spotify", " - Spotify"]
strip_prefixes = ["▶ ", "⏸ "]
details = ["🎧 {track}", "Listening to {track}", "{track}", "Listening to music"]
state = ["by {artist}", "{artist}", "Now playing", "{elapsed} of vibes"]
large_image = "spotify"
large_text = "Spotify"
small_image = "music"
buttons = [{ label = "Open Spotify", url = "https://open.spotify.com" }]

[[app]]
id = "vlc"
name = "VLC"
category = "media"
priority = 44
process = ["vlc.exe"]
media = true
activity_type = 3
strip_suffixes = [" - VLC media player"]
details = ["Watching {track}", "Playing {track}", "Watching something"]
state = ["VLC", "{elapsed} playback", "{time_of_day} viewing"]
large_image = "vlc"
large_text = "VLC media player"

