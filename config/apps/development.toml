[[app]]
id = "vscode"
name = "Visual Studio Code"
category = "development"
priority = 65
process = ["Code.exe", "Code - Insiders.exe"]
strip_suffixes = [" - Visual Studio Code", " - Code - Insiders", " - Insiders"]
details = ["Editing {filename}", "Writing {filename}", "Working on {project}", "Coding in {project}"]
state = ["{project} · {elapsed}", "{project}", "{time_of_day} coding"]
large_image = "vscode"
large_text = "Visual Studio Code"
buttons = [{ label = "Website", url = "https://code.visualstudio.com" }]

