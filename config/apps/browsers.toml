# ═══════════════════════════════════════════════════════════════════════
#  Browsers
#
#  Privacy-first: page titles are hidden by default. If you want the page
#  title in your status, add e.g.  state = ["{title_short}"]  to a rule.
#  Incognito/InPrivate/private windows never expose their title.
# ═══════════════════════════════════════════════════════════════════════

[[app]]
id = "chrome"
name = "Google Chrome"
category = "browser"
priority = 50
process = ["chrome.exe"]
requires_foreground = true
strip_suffixes = [" - Google Chrome"]
details = ["Browsing the web", "Surfing the web", "Reading online", "Down a rabbit hole"]
state = ["{time_of_day} browsing", "{elapsed} online", "One more tab"]
large_image = "chrome"
large_text = "Google Chrome"

